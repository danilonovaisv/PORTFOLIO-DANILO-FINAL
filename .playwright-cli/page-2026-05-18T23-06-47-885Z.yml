          - generic [ref=e44]:
            - generic [ref=e45]:
              - generic [ref=e47]:
                - heading "O QUE PERMANECE" [level=2] [ref=e48]
                - paragraph [ref=e49]: Desde cedo, sempre prestei atenção no que ficava — não só no que aparecia. Enquanto muitos olhavam para o brilho imediato, eu era atraído pelos vestígios, pelos detalhes que sobreviviam ao tempo. A essência das coisas sempre falou mais alto do que a superfície.
              - generic [ref=e51]:
                - heading "DO TRAÇO À INTENÇÃO" [level=2] [ref=e52]
                - paragraph [ref=e53]: Rabiscos viraram ideias. Ideias viraram projetos. E os projetos começaram a deixar rastros. Meu processo criativo nasceu do improviso, do lápis na margem do caderno. Aos poucos, aquilo que era instinto virou direção. Com cada tentativa, aprendi a dar forma ao invisível — até que os conceitos começaram a falar por si.
              - generic [ref=e55]:
                - heading "A DESCOBERTA DO INVISÍVEL" [level=2] [ref=e56]
                - paragraph [ref=e57]: "Foi ali que entendi: design não é enfeite. É ferramenta invisível de transformação. Por trás de cada escolha visual, existe intenção. Descobri que o design verdadeiro não grita — ele conduz. Ele está presente nos detalhes que ninguém percebe, mas que todos sentem. Transformar sem que se perceba a transformação: isso é potência."
              - generic [ref=e59]:
                - heading "EXPANSÃO COM PROPÓSITO" [level=2] [ref=e60]
                - paragraph [ref=e61]: "Estudei Comunicação, mergulhei no design, no branding e hoje uso inteligência artificial para expandir o alcance sem perder a essência humana da criação. Minha trajetória uniu intuição com método, arte com estratégia. O futuro pede novas ferramentas — e eu as abracei. Mas nunca deixei que a tecnologia apagasse o que me move: a sensibilidade, o olhar atento, a busca pelo significado."
