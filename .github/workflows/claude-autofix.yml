# .github/workflows/claude-auto-fix.yml
name: Claude Auto-Fix CI Failures

on:
  workflow_run:
    workflows:
      - "Firebase Deploy"
      - "Deploy to Firebase Hosting on PR"
      - "Deploy Next.js site to Pages"
      - "CodeQL"
    types:
      - completed

# Evita runs paralelos para o mesmo workflow falho.
# Se um novo fix chegar enquanto o anterior ainda roda, cancela o anterior.
concurrency:
  group: claude-fix-${{ github.event.workflow_run.name }}
  cancel-in-progress: true

jobs:
  audit-and-fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read        # necessário para gh run view em contexto workflow_run
      statuses: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # autentica a gh CLI em todos os steps
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      # Necessário para Claude rodar `npm run build` e validar a correção antes do commit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Claude Code - Audit & Fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 12
            --allowedTools "Bash(gh run view:*),Bash(gh run download:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(npm run build),Bash(npm run lint),Bash(npm run type-check),Read,Edit,Write"
          prompt: |
            ## Contexto da Falha

            O workflow **"${{ env.FAILED_WORKFLOW }}"** falhou.
            - Run ID: `${{ env.FAILED_RUN_ID }}`
            - Branch: `${{ env.FAILED_BRANCH }}`
            - Commit: `${{ env.FAILED_SHA }}`

            ## Stack do Projeto

            - **Framework**: Next.js 14+ com App Router
            - **Linguagem**: TypeScript (strict mode)
            - **Estilo**: Tailwind CSS
            - **3D/Animação**: React Three Fiber, @react-three/drei, Three.js, Framer Motion
            - **Backend**: Supabase (Storage + Auth), Firebase Hosting
            - **Estrutura principal**: `src/app/` (rotas e páginas), `src/components/` (componentes)

            ## Erros Comuns desta Stack (priorize ao analisar)

            1. Componentes com Three.js/Framer Motion sem `"use client"` no topo do arquivo
            2. Erros de tipagem TypeScript em props de componentes ou tipos de retorno de funções async
            3. Imports dinâmicos ausentes para componentes que usam `window` ou APIs do browser
            4. Configuração de `next.config.js` incompatível com módulos WebGL/Three.js
            5. Variáveis de ambiente ausentes ou com nome incorreto no build (prefixo `NEXT_PUBLIC_`)
            6. Rotas do App Router com `generateStaticParams` faltando em rotas dinâmicas estáticas

            ## Missão (execute nesta ordem)

            ### Passo 1 - Diagnóstico
            ```
            gh run view ${{ env.FAILED_RUN_ID }} --log-failed
            ```
            Leia os logs completos. Identifique o erro raiz (não o sintoma). 
            Se os logs forem extensos, foque nas últimas 100 linhas do step que falhou.

            ### Passo 2 - Localização
            Com base no erro, localize o(s) arquivo(s) responsável(is) em `src/`.
            Leia o arquivo completo antes de qualquer edição.

            ### Passo 3 - Correção
            Edite apenas o necessário. Não refatore código que não causou a falha.
            Após cada edição, valide localmente:
            ```
            npm run type-check  # se disponível, senão: npx tsc --noEmit
            npm run lint
            npm run build
            ```
            Se o build passar, prossiga. Se falhar com novo erro, corrija também.

            ### Passo 4 - Commit e PR
            Crie uma branch com o padrão: `fix/claude-<workflow-slug>-<run-id-curto>`
            Exemplo: `fix/claude-firebase-deploy-${{ env.FAILED_RUN_ID }}`

            ```
            git checkout -b fix/claude-$(echo "${{ env.FAILED_WORKFLOW }}" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')-${{ env.FAILED_RUN_ID }}
            git add <arquivos alterados>
            git commit -m "fix: <descrição curta do problema>

            Workflow: ${{ env.FAILED_WORKFLOW }}
            Run ID: ${{ env.FAILED_RUN_ID }}
            
            Causa raiz: <uma frase explicando o erro>
            Solução aplicada: <uma frase explicando o que foi mudado>"
            git push origin HEAD
            ```

            Abra o PR com:
            ```
            gh pr create \
              --base ${{ env.FAILED_BRANCH }} \
              --title "fix: <título descritivo>" \
              --body "## Falha Corrigida

            **Workflow:** ${{ env.FAILED_WORKFLOW }}
            **Run ID:** [${{ env.FAILED\_RUN\_ID }}\](https://github.com/${{ github.repository }}/actions/runs/${{ env.FAILED_RUN_ID }})

            ## Diagnóstico
            <causa raiz identificada nos logs>

            ## Arquivos Modificados
            <lista dos arquivos e o que foi alterado em cada um>

            ## Validação Local
            - [ ] \`npm run type-check\` passou
            - [ ] \`npm run lint\` passou  
            - [ ] \`npm run build\` passou

            ---
            *PR gerado automaticamente pelo Claude Code após análise dos logs de CI.*"
            ```

            ## Restrições

            - **Não modifique** arquivos fora de `src/`, `public/`, `next.config.*`, `tsconfig.json`, `package.json`
            - **Não remova** dependências, apenas adicione se estritamente necessário
            - **Não faça commit direto** em `main`, `master` ou na branch que falhou
            - **Se não encontrar** causa raiz clara nos logs, crie o PR apenas com o diagnóstico no body e marque como draft
