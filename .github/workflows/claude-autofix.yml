name: Claude Auto-Fix CI Failures

on:
  workflow_run:
    workflows:
      - "Firebase Deploy"
      - "Deploy to Firebase Hosting on PR"
      - "Deploy Next.js site to Pages"
      - "CodeQL"
    types:
      - completed

concurrency:
  group: claude-fix-${{ github.event.workflow_run.name }}
  cancel-in-progress: true

jobs:
  audit-and-fix:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Claude Auto-Fix Logic
        run: |
          echo "Processando falha do CI via agente autônomo (Run ID: ${{ env.FAILED_RUN_ID }})"
          # Mantenha aqui a chamada oficial do seu agente Claude/gh CLI
