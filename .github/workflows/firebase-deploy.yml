name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Build and deploy to Firebase
    runs-on: ubuntu-latest

    env:
      CI: true
      FIREBASE_PROJECT_ID: portfolio-danilo-novais
      NO_UPDATE_NOTIFIER: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
      npm_config_legacy_peer_deps: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate pnpm lockfile
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "ERROR: pnpm-lock.yaml not found."
            exit 1
          fi

      - name: Validate required secrets
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "ERROR: Missing secret FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Missing secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Missing secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/)
              ;;
            *)
              echo "ERROR: NEXT_PUBLIC_SUPABASE_URL must be an https://*.supabase.co URL"
              exit 1
              ;;
          esac
          echo "Required public Supabase env vars are configured."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production env file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" > .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" >> .env
          echo "✅ Production .env file created."

      - name: Verify Next.js presence
        run: |
          pnpm exec next --version

      - name: Run quality gates
        run: pnpm run build-check

      - name: Run Firebase preflight
        run: pnpm run firebase:preflight

      - name: Build application
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run build

      - name: Verify Firebase CLI
        run: pnpm exec firebase --version

      - name: Prepare Firebase framework bundler
        run: |
          mkdir -p "${{ runner.temp }}/firebase-esbuild"
          cd "${{ runner.temp }}/firebase-esbuild"
          npm init -y >/dev/null
          npm install esbuild@0.19.12 --no-save --no-audit --no-fund
          echo "${{ runner.temp }}/firebase-esbuild/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=${{ runner.temp }}/firebase-esbuild/node_modules" >> "$GITHUB_ENV"
          "${{ runner.temp }}/firebase-esbuild/node_modules/.bin/esbuild" --version

      - name: Write service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS }}
        run: |
          echo "$FIREBASE_SA" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        timeout-minutes: 12
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm exec firebase deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
