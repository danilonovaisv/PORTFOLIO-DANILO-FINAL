name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  NODE_VERSION: "20"
  FIREBASE_CLI_PREVIEWS: "codebundles"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Mantendo a versão do seu arquivo original

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies with pnpm
        run: pnpm install --frozen-lockfile # Usando frozen-lockfile para consistência

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true # Mantendo a tolerância a erros temporária

      - name: Run type check
        run: pnpm run typecheck
        continue-on-error: true # Mantendo a tolerância a erros temporária

      - name: Validate Supabase env vars
        run: |
          echo "🔍 Verificando variáveis de ambiente do Supabase..."
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ ERRO: NEXT_PUBLIC_SUPABASE_URL não configurada em GitHub Secrets."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ ERRO: NEXT_PUBLIC_SUPABASE_ANON_KEY não configurada em GitHub Secrets."
            exit 1
          fi
          echo "✅ Variáveis do Supabase validadas com sucesso."
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Passo adicionado para corrigir o link no package.json das funções, se necessário
      - name: Fix functions package.json links (if any)
        run: |
          FUNCTIONS_PKG_JSON="functions/package.json"
          if [ -f "$FUNCTIONS_PKG_JSON" ] && grep -q '"link:' "$FUNCTIONS_PKG_JSON"; then
            echo "⚠️ Detectado protocolo 'link:' em $FUNCTIONS_PKG_JSON"
            sed -i 's|"link:\([^"]*\)"|"file:\1"|g' "$FUNCTIONS_PKG_JSON"
            echo "✅ Corrigido para 'file:' em $FUNCTIONS_PKG_JSON"
          else
            echo "ℹ️ Nenhum protocolo 'link:' encontrado ou $FUNCTIONS_PKG_JSON não existe."
          fi

      - name: Build Cloud Functions
        run: cd functions && pnpm run build

      # --- PASSO CRÍTICO CORRIGIDO ---
      # Este passo prepara o ambiente para o build das funções no Cloud Build (que usa npm)
      - name: Prepare environment for Firebase Cloud Build
        run: |
          echo "🔄 Preparando ambiente NPM para Firebase Cloud Build..."
          
          # Remove node_modules (instalados via pnpm) para reinstalar via npm
          rm -rf node_modules
          
          # Remove o campo 'packageManager' do package.json RAIZ usando sed corretamente
          # Importante: Usar aspas simples para proteger o padrão do shell
          sed -i '/"packageManager":/d' package.json
          echo "✅ Campo packageManager removido do package.json raiz"
          
          # Validação adicional: Verifica se o package.json ainda é um JSON válido após a edição
          if ! python3 -m json.tool < package.json > /dev/null 2>&1; then
              echo "❌ ERRO: O package.json raiz ficou com sintaxe inválida após a remoção do packageManager."
              cat package.json # Mostra o conteúdo para depuração
              exit 1
          fi
          echo "✅ package.json raiz é um JSON válido após edição."
          
          # Instala dependências via npm (necessário para o Cloud Build)
          npm install --legacy-peer-deps
          echo "✅ npm install concluído para Cloud Build"
          
          # Opcional: Tentar gerar um package-lock.json atualizado, se necessário para consistência no Cloud Build
          echo "📦 Gerando package-lock.json alinhado para Cloud Build (opcional)..."
          npm install --legacy-peer-deps --package-lock-only --ignore-scripts || \
          npm install --legacy-peer-deps --package-lock-only --ignore-scripts --force || \
          echo "⚠️ Aviso: Não foi possível gerar package-lock.json fresco. Continuando..."
          echo "✅ package-lock.json (re)gerado (ou ignorado)"

      # --- PASSOS DE AUTENTICAÇÃO E DEPLOY ---
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Firebase CLI
        uses: firebase-actions/setup-bundled-cli@v2
        with:
          version: latest

      # --- PASSO DE PREPARAÇÃO DOS ARQUIVOS DE HOSPEDAGEM (Baseado no debug antigo) ---
      # Este passo copia os arquivos estáticos gerados para o diretório de hospedagem do Firebase
      - name: Prepare hosting files
        run: |
          # Cria o diretório público esperado pelo Firebase Hosting
          mkdir -p dist/hosting
          
          # Assumindo que o build do Next.js gera arquivos em ./out (padrão antigo) ou ./dist (customizado)
          # Verifica se ./dist existe e tem conteúdo
          if [ -d "./dist" ] && [ "$(ls -A ./dist)" ]; then
            echo "📁 Copiando arquivos de ./dist para dist/hosting/"
            cp -r ./dist/* dist/hosting/
          elif [ -d "./out" ] && [ "$(ls -A ./out)" ]; then
            echo "📁 Copiando arquivos de ./out para dist/hosting/"
            cp -r ./out/* dist/hosting/
          else
            echo "⚠️ Nenhum diretório de build padrão ('./dist' ou './out') encontrado ou está vazio."
            echo "    Verifique a saída do build do Next.js e ajuste este passo."
            # Se for Next.js App Router com export, o padrão é ./out
            # mkdir -p out # Garantir que existe
            # cp -r ./out/* dist/hosting/ # Descomentar se for o caso
          fi

          # Copia arquivos raiz importantes para o diretório de hospedagem, se existirem
          cp public/** dist/hosting/ 2>/dev/null || echo "ℹ️ Pasta 'public' não encontrada ou vazia."
          cp favicon.ico dist/hosting/ 2>/dev/null || echo "ℹ️ favicon.ico não encontrado."
          cp vercel.svg dist/hosting/ 2>/dev/null || echo "ℹ️ vercel.svg não encontrado."
          cp next.svg dist/hosting/ 2>/dev/null || echo "ℹ️ next.svg não encontrado."
          cp .well-known/** dist/hosting/.well-known/ 2>/dev/null || echo "ℹ️ Pasta '.well-known' não encontrada ou vazia."

          # Garante que _routes e _headers estejam presentes, mesmo que vazios
          touch dist/hosting/_routes dist/hosting/_headers
          
          # Se você gerar um .env.production durante o deploy, copie-o aqui
          # cp .env.production dist/hosting/.env.production 2>/dev/null || echo "ℹ️ .env.production não encontrado para hospedagem estática."

      # --- PASSO DE DEPLOY ---
      # Executa o deploy para o Firebase Hosting e Functions
      - name: Deploy to Firebase
        run: |
          # Comando principal de deploy
          # O --except extensions evita problemas comuns de permissão se o SA não tiver roles específicas
          firebase deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT }} --non-interactive --except extensions
        env:
          FIREBASE_CLI_PREVIEWS: codebundles

      # --- PASSOS DE NOTIFICAÇÃO ---
      - name: Notify success
        if: success()
        run: echo "✅ Pipeline de deploy executado com sucesso."
        shell: bash

      - name: Notify failure
        if: failure()
        run: echo "❌ Pipeline de deploy falhou."
        shell: bash
