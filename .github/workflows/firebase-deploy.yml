name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Build and deploy to Firebase
    runs-on: ubuntu-latest

    env:
      FIREBASE_PROJECT_ID: portfolio-danilo-novais
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Validate pnpm lockfile
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "ERROR: pnpm-lock.yaml not found."
            exit 1
          fi

      - name: Validate required secrets
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "ERROR: Missing secret FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Missing secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Missing secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.co/)
              ;;
            *)
              echo "ERROR: NEXT_PUBLIC_SUPABASE_URL must be an https://*.supabase.co URL"
              exit 1
              ;;
          esac
          echo "Required public Supabase env vars are configured."

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Verify Next.js presence
        run: |
          pnpm exec next --version

      - name: Run quality gates
        run: pnpm run build-check

      - name: Run Firebase preflight
        run: pnpm run firebase:preflight

      - name: Build application
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run build

      - name: Install Firebase CLI
        run: pnpm dlx firebase-tools --version

      - name: Write service account credentials
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_DANILO_NOVAIS }}
        run: |
          echo "$FIREBASE_SA" > "${{ runner.temp }}/firebase-service-account.json"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm dlx firebase-tools deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}"
