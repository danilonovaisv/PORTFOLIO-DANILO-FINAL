name: Test and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

env:
  NODE_VERSION: "20"
  FIREBASE_CLI_PREVIEWS: "codebundles"

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Supabase env vars
        run: |
          echo "🔍 Verificando variáveis de ambiente do Supabase..."
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ ERRO: NEXT_PUBLIC_SUPABASE_URL não configurada em GitHub Secrets."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ ERRO: NEXT_PUBLIC_SUPABASE_ANON_KEY não configurada em GitHub Secrets."
            exit 1
          fi
          echo "✅ Variáveis do Supabase validadas com sucesso."
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Passo adicionado para corrigir o link no package.json das funções
      - name: Fix functions package.json links
        run: |
          if grep -q '"link:' functions/package.json; then
            echo "⚠️ Detectado protocolo 'link:' em functions/package.json"
            sed -i 's/"link:src\//"file:..\/src\//g' functions/package.json
            echo "✅ Corrigido para 'file:../src/'"
          else
            echo "ℹ️ Nenhum protocolo 'link:' encontrado em functions/package.json."
          fi

      - name: Build Cloud Functions
        run: cd functions && pnpm run build

      - name: Generate .env.production for deployment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > .env.production
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}" >> .env.production
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.production

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Firebase CLI
        uses: firebase-actions/setup-bundled-cli@v2
        with:
          version: latest

      - name: Prepare hosting files
        run: |
          # Cria o diretório público esperado pelo Firebase Hosting
          mkdir -p dist/hosting
          # Assume que seu comando de build gera arquivos estáticos em ./dist
          # Se o destino for diferente, ajuste o caminho abaixo.
          # Exemplo: se o build gera em 'out', troque 'cp -r dist/*' por 'cp -r out/*'
          cp -r .next/* dist/hosting/ || echo "Nenhum conteúdo padrão de .next encontrado ou .next vazio."

          # Copia o .env.production gerado para o diretório de hospedagem
          cp .env.production dist/hosting/.env.production

          # Copia arquivos raiz importantes para o diretório de hospedagem
          cp public/** dist/hosting/ 2>/dev/null || echo "Nenhuma pasta 'public' encontrada ou vazia."
          cp favicon.ico dist/hosting/ 2>/dev/null || echo "favicon.ico não encontrado."
          cp vercel.svg dist/hosting/ 2>/dev/null || echo "vercel.svg não encontrado."
          cp next.svg dist/hosting/ 2>/dev/null || echo "next.svg não encontrado."
          cp .well-known/** dist/hosting/.well-known/ 2>/dev/null || echo "Nenhuma pasta '.well-known' encontrada ou vazia."

          # Garante que _routes e _headers estejam presentes, mesmo que vazios
          touch dist/hosting/_routes dist/hosting/_headers

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT }} --non-interactive
        env:
          FIREBASE_CLI_PREVIEWS: codebundles

      - name: Notify success
        if: success()
        run: echo "✅ Pipeline de deploy executado com sucesso."
        shell: bash

      - name: Notify failure
        if: failure()
        run: echo "❌ Pipeline de deploy falhou."
        shell: bash
