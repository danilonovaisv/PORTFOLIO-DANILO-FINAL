name: Firebase Deploy

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Utilizar a tag @v4 facilita a leitura, mas você pode manter o SHA se sua política de segurança exigir pinning estrito.
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm' # Substitui as +10 linhas de configuração manual de cache

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Validate functions codebase
        run: |
          if grep -q '"link:' functions/package.json; then
            echo "⚠️  Detectado protocolo 'link:' em functions/package.json"
            sed -i 's/"link:src\//"file:..\/src\//g' functions/package.json
            echo "✅ Corrigido para 'file:../src/'"
          fi
          # Validar instalação das funções
          cd functions && npm install

      - name: Build Next.js application
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare hosting files
        run: bash scripts/prepare-hosting.sh

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        # A flag --only aceita múltiplos alvos separados por vírgula (sem espaços)
        run: |
          firebase experiments:enable webframeworks
          firebase deploy --only hosting,functions:modern_ssr:ssr_modern --project portfolio-danilo-novais
        env:
          # A flag --token está depreciada. A CLI lê automaticamente esta variável de ambiente.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify success
        if: success()
        run: |
          echo "✅ Deploy completed successfully!"
          echo "🌐 Site: https://portfolio-danilo-novais.web.app"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Pipeline de deploy falhou."
