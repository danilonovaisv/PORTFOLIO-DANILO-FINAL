# AI Self-Healing Agent Workflow
# Automatically analyzes deployment failures and suggests fixes
# Triggered when Firebase deploy workflows fail
#
# HOW TO USE:
# - This workflow runs automatically when a deploy fails
# - You can also trigger it manually via workflow_dispatch
# - Creates a GitHub issue with AI-generated fix suggestions

name: 🛡️ AI Self-Healing Agent

on:
  workflow_run:
    workflows:
      - Firebase Deploy
      - Deploy to Firebase Hosting on PR
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to analyze'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Get error logs
        id: get_logs
        run: |
          RUN_ID="${{ github.event.inputs.run_id || github.event.workflow_run.id }}"
          if [ -n "$RUN_ID" ]; then
            gh run view "$RUN_ID" --log-failed > error_logs.txt 2>&1 || echo "No failed logs found" > error_logs.txt
          else
            echo "No workflow run ID available" > error_logs.txt
          fi
          # Truncate to avoid exceeding prompt limits
          head -c 8000 error_logs.txt > error_logs_truncated.txt
          mv error_logs_truncated.txt error_logs.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🧾 Build analysis prompt
        id: build_prompt
        run: |
          {
            echo "prompt<<EOF_MARKER"
            echo "Analyze these failed workflow logs from a Next.js 16 project deployed to Firebase Hosting."
            echo "Tech stack: Next.js 16 (App Router), pnpm, Firebase Hosting with webframeworks, Supabase."
            echo
            echo "--- ERROR LOGS ---"
            cat error_logs.txt
            echo
            echo "--- END LOGS ---"
            echo
            echo "Provide:"
            echo "1. Root cause (1-2 sentences)"
            echo "2. Corrected code snippet if applicable"
            echo "3. Any config changes needed in firebase.json, next.config.mjs, or GitHub Secrets"
            echo "EOF_MARKER"
          } >> "$GITHUB_OUTPUT"

      - name: 🤖 Gemini AI Analysis
        id: gemini_analysis
        if: ${{ env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}

      - name: 🛠️ Create fix suggestion issue
        if: always()
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            RESPONSE="⚠️ Gemini analysis skipped: GEMINI_API_KEY secret is not configured."
          elif [ -z "$GEMINI_RESPONSE" ]; then
            RESPONSE="⚠️ Gemini analysis returned empty or failed. Check error_logs.txt manually."
          else
            RESPONSE="${GEMINI_RESPONSE}"
          fi

          {
            echo "## 🤖 AI Self-Healing Report"
            echo
            echo "**Trigger:** ${{ github.event.workflow_run.name || 'Manual dispatch' }}"
            echo "**Run ID:** ${{ github.event.inputs.run_id || github.event.workflow_run.id || 'N/A' }}"
            echo "**Timestamp:** $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "### Analysis"
            echo
            echo "$RESPONSE"
          } > issue_body.md

          # Check for duplicate open issues to avoid spam
          EXISTING=$(gh issue list --state open --label "ai-healing" --limit 1 --json number -q '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue_body.md
            echo "📝 Added comment to existing issue #$EXISTING"
          else
            gh issue create \
              --title "🤖 Auto-fix Suggestion: Deploy Failure ($(date -u '+%Y-%m-%d'))" \
              --body-file issue_body.md \
              --label "ai-healing"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_RESPONSE: ${{ steps.gemini_analysis.outputs.gemini_response }}
