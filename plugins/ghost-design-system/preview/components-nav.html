<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        background: #040013;
        font-family: var(--font-sans);
        padding: 24px 0;
      }
      .bg {
        background: linear-gradient(to bottom, #0c1445 0%, #040013 100%);
        padding: 20px 0 30px;
      }

      /* Fluid glass header */
      .header-wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .header-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 32px;
        border-radius: 9999px;
        background: rgba(4, 0, 19, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }
      .header-glow {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          circle at 50% 0%,
          rgba(0, 72, 255, 0.2),
          transparent 60%
        );
        pointer-events: none;
      }
      .logo {
        display: flex;
        align-items: center;
      }
      .logo img {
        height: 28px;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .nav-item {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.55);
        position: relative;
        padding: 4px 0;
        cursor: pointer;
      }
      .nav-item.active {
        color: #0048ff;
        font-weight: 600;
      }
      .nav-item.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 1px;
        background: #0048ff;
      }
      .nav-item:not(.active):hover {
        color: #fcffff;
      }

      /* Mobile header bar */
      .mobile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        background: rgba(4, 0, 19, 0.85);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        margin-top: 24px;
      }
      .hamburger {
        display: flex;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
      }
      .hamburger span {
        width: 22px;
        height: 1.5px;
        background: #fcffff;
        border-radius: 2px;
      }
      .mobile-label {
        font-family: var(--font-mono);
        font-size: 9px;
        color: #a1a3a3;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-top: 6px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="header-wrap">
        <div class="header-pill">
          <div class="header-glow"></div>
          <div class="logo">
            <img
              src="../assets/LogoDark.svg"
              alt="Danilo"
              onerror="
                this.style.display = 'none';
                this.nextElementSibling.style.display = 'flex';
              "
            />
            <span
              style="
                display: none;
                font-weight: 800;
                font-size: 16px;
                color: #fcffff;
                letter-spacing: -0.03em;
              "
              >danilo</span
            >
          </div>
          <nav>
            <span class="nav-item active">home</span>
            <span class="nav-item">sobre</span>
            <span class="nav-item">portfólio</span>
            <span class="nav-item">contato</span>
          </nav>
        </div>
      </div>

      <div class="mobile-label">↑ Desktop — Fluid Glass Pill</div>
      <div class="mobile-bar" style="margin-top: 20px">
        <div class="logo">
          <img
            src="../assets/favicon_dark.svg"
            alt="D"
            style="height: 24px"
            onerror="this.style.display = 'none'"
          />
          <span
            style="
              font-weight: 800;
              font-size: 14px;
              color: #fcffff;
              margin-left: 8px;
              letter-spacing: -0.03em;
            "
            >danilo</span
          >
        </div>
        <div class="hamburger">
          <span></span><span style="width: 16px"></span><span></span>
        </div>
      </div>
      <div class="mobile-label">↑ Mobile — Bar + Hamburger</div>
    </div>
  </body>
</html>
