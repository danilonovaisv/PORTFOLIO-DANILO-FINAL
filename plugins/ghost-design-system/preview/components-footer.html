<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #040013; font-family: var(--font-sans); }
  .footer {
    background: #0048ff; color: #fcffff;
    padding: 20px 48px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .copyright { font-size: 10px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.9; }
  nav { display: flex; gap: 28px; }
  .nav-link { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; color: #fcffff; text-decoration: none; opacity: 0.9; }
  .socials { display: flex; gap: 16px; align-items: center; }
  .social-icon { width: 18px; height: 18px; opacity: 0.85; }
  /* inline SVG icons */
  svg { fill: #fcffff; }
</style>
</head>
<body>
  <div class="footer">
    <div class="copyright">© 2025 Danilo Novais Vilela — todos os direitos reservados</div>
    <nav>
      <a class="nav-link" href="#">home</a>
      <a class="nav-link" href="#">sobre</a>
      <a class="nav-link" href="#">portfólio</a>
      <a class="nav-link" href="#">contato</a>
      <a class="nav-link" href="#">privacidade</a>
    </nav>
    <div class="socials">
      <!-- Instagram icon -->
      <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="#fcffff" stroke-width="1.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fcffff" stroke-width="1.5"/><circle cx="17.5" cy="6.5" r="1" fill="#fcffff"/></svg>
      <!-- LinkedIn icon -->
      <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="#fcffff" stroke-width="1.5"/><line x1="7" y1="10" x2="7" y2="17" stroke="#fcffff" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="7.5" r="1" fill="#fcffff"/><path d="M11 10v7M11 13c0-2 6-3 6 1v3" stroke="#fcffff" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      <!-- Twitter/X icon -->
      <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 4l16 16M4 20L20 4" stroke="#fcffff" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>
</body>
</html>
