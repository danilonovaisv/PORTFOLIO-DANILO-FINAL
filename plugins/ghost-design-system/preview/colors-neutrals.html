<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="card">
      <div class="row" style="gap: 14px; flex-wrap: wrap">
        <div class="col" style="align-items: flex-start">
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 16px;
              background: #040013;
              border: 1px solid rgba(255, 255, 255, 0.1);
            "
          ></div>
          <div class="mono">background</div>
          <div class="mono" style="color: #fff">#040013</div>
          <div class="mono">void black</div>
        </div>
        <div class="col" style="align-items: flex-start">
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 16px;
              background: #0b0d3a;
            "
          ></div>
          <div class="mono">neutral</div>
          <div class="mono" style="color: #fff">#0B0D3A</div>
          <div class="mono">deep card</div>
        </div>
        <div class="col" style="align-items: flex-start">
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 16px;
              background: #fcffff;
            "
          ></div>
          <div class="mono">text</div>
          <div class="mono" style="color: #fff">#FCFFFF</div>
          <div class="mono">primary fg</div>
        </div>
        <div class="col" style="align-items: flex-start">
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 16px;
              background: #a1a3a3;
            "
          ></div>
          <div class="mono">textSecondary</div>
          <div class="mono" style="color: #fff">#A1A3A3</div>
          <div class="mono">metadata</div>
        </div>
        <div class="col" style="align-items: flex-start">
          <div
            style="
              width: 88px;
              height: 88px;
              border-radius: 16px;
              background: #f0f0f0;
            "
          ></div>
          <div class="mono">backgroundLight</div>
          <div class="mono" style="color: #fff">#F0F0F0</div>
          <div class="mono">contact</div>
        </div>
      </div>
    </div>
  </body>
</html>
