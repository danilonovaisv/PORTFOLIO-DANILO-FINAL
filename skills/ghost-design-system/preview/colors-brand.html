<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="card">
  <div class="row" style="gap:14px;flex-wrap:wrap;">
    <div class="col" style="align-items:flex-start;">
      <div style="width:88px;height:88px;border-radius:16px;background:#0048ff;box-shadow:0 15px 45px rgba(0,72,255,.35);"></div>
      <div class="mono">bluePrimary</div>
      <div class="mono" style="color:#fff;">#0048FF</div>
    </div>
    <div class="col" style="align-items:flex-start;">
      <div style="width:88px;height:88px;border-radius:16px;background:#4fe6ff;box-shadow:0 0 40px rgba(79,230,255,.45);"></div>
      <div class="mono">blueAccent</div>
      <div class="mono" style="color:#fff;">#4FE6FF</div>
    </div>
    <div class="col" style="align-items:flex-start;">
      <div style="width:88px;height:88px;border-radius:16px;background:#8705f2;box-shadow:0 0 40px rgba(135,5,242,.55);"></div>
      <div class="mono">purpleDetails</div>
      <div class="mono" style="color:#fff;">#8705F2</div>
    </div>
    <div class="col" style="align-items:flex-start;">
      <div style="width:88px;height:88px;border-radius:16px;background:#f501d3;"></div>
      <div class="mono">pinkDetails</div>
      <div class="mono" style="color:#fff;">#F501D3</div>
    </div>
    <div class="col" style="align-items:flex-start;">
      <div style="width:88px;height:88px;border-radius:16px;background:#e50914;"></div>
      <div class="mono">redAccent</div>
      <div class="mono" style="color:#fff;">#E50914</div>
    </div>
  </div>
</div>
</body></html>
