# Managed Codex environment profile for this repository
version = 1
name = "PORTFOLIO-DANILO-FINAL"

[setup]
script = '''
# Validate minimum runtime requirements first
if command -v node >/dev/null 2>&1; then
  NODE_MAJOR=$(node -v | sed 's/v//' | cut -d. -f1)
  if [ "$NODE_MAJOR" -lt 20 ]; then
    echo "⚠️ Node version is $NODE_MAJOR, expected >= 20"
  fi
else
  echo "⚠️ Node.js is not installed"
fi

# Ensure pnpm version expected by this repo
corepack enable
corepack prepare pnpm@10.33.0 --activate

# Prefer lockfile-consistent install, fallback for first bootstrap scenarios
pnpm install --frozen-lockfile || pnpm install
'''

[[actions]]
name = "Dev"
icon = "run"
command = "pnpm run dev"

[[actions]]
name = "Build (strict/prod-like)"
icon = "run"
command = "pnpm run build-check && pnpm run build"

[[actions]]
name = "Validate env"
icon = "test"
command = "pnpm run validate-env"

[[actions]]
name = "Lint"
icon = "test"
command = "pnpm run lint"

[[actions]]
name = "Typecheck"
icon = "test"
command = "pnpm run typecheck"

[[actions]]
name = "Tests"
icon = "test"
command = "pnpm run test"

[[actions]]
name = "E2E"
icon = "test"
command = "pnpm run test:e2e"

[[actions]]
name = "Audit assets"
icon = "test"
command = "pnpm run assets:audit"

[[actions]]
name = "Analyze bundle"
icon = "test"
command = "pnpm run analyze:bundle"

[[actions]]
name = "Prepare deploy"
icon = "run"
command = "pnpm run prepare-deploy"

[[actions]]
name = "Clean project"
icon = "debug"
command = "pnpm run clean && rm -rf node_modules && pnpm install"
