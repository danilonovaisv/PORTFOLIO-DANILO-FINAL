name = "portfolio-danilo-final"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "PORTFOLIO_ASSETS"
bucket_name = "portfolio-assets"


# === D1 DATABASE (CORRIGIDO) ===
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"

# === RUNTIME VARIABLES (Sincronizado com Cloudflare Dashboard) ===
[vars]
CLOUDFLARE_ONLY = "true"
NEXT_PUBLIC_R2_PUBLIC_URL = "https://assets.portfoliodanilo.com"
R2_BUCKET_NAME = "portfolio-assets"
S3_API_URL = "https://f48c066525478bcaf66928b32ed721d2.r2.cloudflarestorage.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAAACgcpmYImvbq_qQg"
