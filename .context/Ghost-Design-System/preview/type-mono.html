<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #040013; font-family: var(--font-sans); padding: 20px 24px; }
  .row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 20px; }
  .row:last-child { border-bottom: none; }
  .label { font-family: var(--font-mono); font-size: 9px; color: #8705f2; width: 130px; flex-shrink: 0; letter-spacing: 0.1em; text-transform: uppercase; }
  .sample { font-family: var(--font-mono); color: #4fe6ff; }
  .tag-pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9px;
    color: #fcffff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 3px 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-right: 6px;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="label">Micro Tag</div>
    <div class="sample" style="font-size:12px">[BRAND AWARENESS]</div>
  </div>
  <div class="row">
    <div class="label">Category Label</div>
    <div class="sample" style="font-size:10px; letter-spacing: 0.2em; text-transform:uppercase; color:#a1a3a3">BRANDING & CAMPANHA · 2024</div>
  </div>
  <div class="row">
    <div class="label">Coordinate</div>
    <div class="sample" style="font-size:11px; color:#a1a3a3">GRU — 15.7801° S, 47.9292° W</div>
  </div>
  <div class="row">
    <div class="label">Tag Pills</div>
    <div>
      <span class="tag-pill">Branding</span>
      <span class="tag-pill">Motion</span>
      <span class="tag-pill">UX/UI</span>
      <span class="tag-pill">Campaign</span>
    </div>
  </div>
  <div class="row">
    <div class="label">Navigation</div>
    <div style="display:flex; gap:24px">
      <span style="font-family:var(--font-sans); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:#fcffff; font-weight:600">home</span>
      <span style="font-family:var(--font-sans); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.5); font-weight:500">sobre</span>
      <span style="font-family:var(--font-sans); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.5); font-weight:500">portfólio</span>
      <span style="font-family:var(--font-sans); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.5); font-weight:500">contato</span>
    </div>
  </div>
</body>
</html>
