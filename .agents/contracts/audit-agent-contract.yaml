version: 1.0.0
name: audit-agent-contract
scope: audit-fullstack-config

principles:
  - no_service_role_key_exposure
  - no_bucket_mutation_without_backup
  - no_firebase_json_mutation_without_diff_preview
  - mandatory_revalidation_after_fix
  - full_action_logging

message_envelope:
  required:
    - correlation_id
    - workflow
    - source_agent
    - target_agent
    - message_type
    - timestamp_utc
    - payload
  fields:
    correlation_id: string
    workflow: audit-fullstack-config
    source_agent: [agent-orchestrator-audit, agent-supabase-audit, agent-firebase-audit]
    target_agent: [agent-orchestrator-audit, agent-supabase-audit, agent-firebase-audit]
    message_type:
      - validate_structure
      - audit_request
      - finding
      - fix_plan
      - apply_fix
      - apply_result
      - revalidate
      - final_report
    timestamp_utc: iso8601
    payload: object

finding_payload:
  required:
    - finding_id
    - domain
    - severity
    - category
    - title
    - evidence
    - auto_fixable
    - recommendation
  fields:
    finding_id: string
    domain: [supabase, firebase, nextjs]
    severity: [critical, high, medium, low, info]
    category:
      - credentials
      - rls_policy
      - bucket_visibility
      - storage_cors
      - hosting_headers
      - hosting_rewrites
      - cache_control
      - env_governance
      - performance
    title: string
    evidence:
      files: string[]
      snippets: string[]
    auto_fixable: boolean
    recommendation: string

fix_plan_payload:
  required:
    - plan_id
    - steps
  fields:
    plan_id: string
    steps:
      - id: string
        description: string
        target_files: string[]
        requires_backup: boolean
        requires_diff_preview: boolean
        rollback:
          strategy: restore_backup
          backup_path: string

retry_policy:
  external_calls:
    attempts: 3
    backoff: exponential
    initial_delay_ms: 500
    max_delay_ms: 5000
  file_mutations:
    attempts: 1

idempotency:
  key: correlation_id + message_type + payload_hash
  guarantee: duplicate_apply_fix_messages_are_noops

required_artifacts:
  - reports/storage-audit.json
  - reports/hosting-audit.json
  - reports/master-audit.json
  - reports/security-score.json
  - reports/performance-score.json
  - reports/final-report.html
