<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="card">
      <div class="col" style="gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 4px; height: 24px; background: #0048ff"></div>
          <span style="font-family: Manrope; font-weight: 600"
            >rounded-md · 8px · featured card</span
          >
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 4px; height: 24px; background: #4fe6ff"></div>
          <span style="font-family: Manrope; font-weight: 600"
            >rounded-lg · 10px · deep neutral card</span
          >
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 4px; height: 24px; background: #8705f2"></div>
          <span style="font-family: Manrope; font-weight: 600"
            >rounded-4xl · 32px · header bar</span
          >
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div style="width: 4px; height: 24px; background: #f501d3"></div>
          <span style="font-family: Manrope; font-weight: 600"
            >rounded-full · pills, CTAs, circle arrows</span
          >
        </div>
        <div class="row" style="margin-top: 6px; gap: 10px">
          <div
            style="
              width: 56px;
              height: 40px;
              background: #0b0d3a;
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 8px;
            "
          ></div>
          <div
            style="
              width: 56px;
              height: 40px;
              background: #0b0d3a;
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 10px;
            "
          ></div>
          <div
            style="
              width: 56px;
              height: 40px;
              background: #0b0d3a;
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 32px;
            "
          ></div>
          <div
            style="
              width: 56px;
              height: 40px;
              background: #0048ff;
              border-radius: 9999px;
            "
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
