<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ghost · portfolio ui kit</title>

<!-- Tokens + kit styles -->
<link rel="stylesheet" href="styles.css" />

<!-- React + Babel (pinned) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* Page-level glue */
  html, body { background: var(--color-background); }

  /* Sticky section dividers — keep the eye anchored */
  .section + .section { border-top: 1px solid rgba(255,255,255,0.04); }

  /* Aura opacity knob (driven by Tweaks) */
  .aura { opacity: var(--aura-opacity, 1); transition: opacity var(--dur-slow) var(--ghost-ease); }

  /* Reduce motion toggle (Tweaks-driven) */
  body[data-reduce-motion="1"] *,
  body[data-reduce-motion="1"] *::before,
  body[data-reduce-motion="1"] *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
</style>
</head>
<body class="ghost-body">
  <div id="root" class="page"></div>

  <!-- Components -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="IconCircleCTA.jsx"></script>
  <script type="text/babel" src="AntigravityCTA.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="PortfolioShowcase.jsx"></script>
  <script type="text/babel" src="FeaturedProjects.jsx"></script>
  <script type="text/babel" src="ContactSection.jsx"></script>
  <script type="text/babel" src="SiteFooter.jsx"></script>
  <script type="text/babel" src="Tweaks.jsx"></script>

  <!-- App -->
  <script type="text/babel">
    function App() {
      const [tweaksVisible, setTweaksVisible] = React.useState(false);

      // Host Tweaks integration (user-toggleable via toolbar)
      React.useEffect(() => {
        const onMsg = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode')   setTweaksVisible(true);
          if (d.type === '__deactivate_edit_mode') setTweaksVisible(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      // IntersectionObserver reveal (GhostFadeUp)
      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            if (en.isIntersecting) {
              en.target.classList.add('is-in');
              io.unobserve(en.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -80px 0px' });
        document.querySelectorAll('.reveal:not(.is-in)').forEach((el) => io.observe(el));
        return () => io.disconnect();
      }, []);

      return (
        <>
          <Header current="home" />
          <Hero />
          <PortfolioShowcase />
          <FeaturedProjects />
          <ContactSection />
          <SiteFooter />
          <AntigravityCTA />
          <TweaksPanel visible={tweaksVisible} onClose={() => setTweaksVisible(false)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
