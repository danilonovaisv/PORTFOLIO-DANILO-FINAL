<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="card">
  <div class="row" style="gap:24px;align-items:flex-end;">
    <div class="col" style="align-items:center;gap:6px;">
      <div style="width:80px;height:80px;background:#0048ff;border-radius:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);"></div>
      <div class="mono">shadow-lg</div>
    </div>
    <div class="col" style="align-items:center;gap:6px;">
      <div style="width:80px;height:80px;background:#0048ff;border-radius:12px;box-shadow:0 15px 45px rgba(0,72,255,.35);"></div>
      <div class="mono">pill · blue-faint</div>
    </div>
    <div class="col" style="align-items:center;gap:6px;">
      <div style="width:80px;height:80px;background:#8705f2;border-radius:9999px;box-shadow:0 0 28px rgba(135,5,242,.5);"></div>
      <div class="mono">hover · purple glow</div>
    </div>
    <div class="col" style="align-items:center;gap:6px;">
      <div style="width:80px;height:80px;background:#040013;border:1px solid rgba(255,255,255,.1);border-radius:12px;"></div>
      <div class="mono">hairline · rgba(255,255,255,.1)</div>
    </div>
  </div>
</div>
</body></html>
