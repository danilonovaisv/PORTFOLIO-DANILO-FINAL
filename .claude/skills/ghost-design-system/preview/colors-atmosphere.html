<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"></head><body>
<div class="card">

    <div style="position:absolute;right:10%;top:10%;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(245,1,211,.28),transparent 70%);filter:blur(20px);"></div>
    <div style="position:absolute;left:24px;bottom:18px;" class="mono">ghost atmosphere · radial + accents</div>
  </div>
</div>
</body></html>
